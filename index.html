<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenArt MCP Dashboard</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .status { display: inline-block; background: #065f46; color: #34d399; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 20px; }
        .link-box { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; font-family: monospace; font-size: 13px; color: #38bdf8; word-break: break-all; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>OpenArt MCP</h2>
        <p>لوحة التحكم وربط البيانات</p>
        <div class="status">● حالة النظام: نشط</div>
        <div class="link-box">https://mcp.openart.ai/mcp</div>
        <p style="font-size: 12px; color: #64748b;">تم استضافة الواجهة بنجاح عبر GitHub Pages</p>
    </div>
</body>
</html>

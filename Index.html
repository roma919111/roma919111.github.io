<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة تكاليف OpenArt MCP</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 850px; }
        .card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 20px; }
        h2 { margin-bottom: 20px; color: var(--primary); text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input { width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: #4b5563; }
        .badge { background-color: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { background-color: #ef4444; width: auto; padding: 8px 16px; font-size: 14px; }
        .logout-btn:hover { background-color: #dc2626; }
        .error-msg { color: #ef4444; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .loading { text-align: center; padding: 20px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="card">
            <h2>تسجيل الدخول للنظام</h2>
            <div id="login-error" class="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم (admin)">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور (password123)">
                </div>
                <button type="submit">دخول</button>
            </form>
        </div>

        <!-- قسم لوحة التحكم -->
        <div id="dashboard-section" class="card hidden">
            <div class="header-flex">
                <h2>لوحة تحكم أسعار OpenArt MCP</h2>
                <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
            </div>
            <p style="margin-bottom: 15px; color: #6b7280; font-size: 14px;">
                التكاليف الأصلية مجلوبة من السيرفر مع إضافة نسبة أرباح تلقائية (30%).
            </p>
            <div id="loading-indicator" class="loading hidden">جاري جلب البيانات...</div>
            <div style="overflow-x: auto;">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th>الخدمة / الباقة</th>
                            <th>الوصف</th>
                            <th>التكلفة الأصلية</th>
                            <th>نسبة الربح</th>
                            <th>السعر النهائي</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <!-- سيتم تعبئة البيانات هنا بواسطة JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginError = document.getElementById('login-error');
        const dataBody = document.getElementById('data-body');
        const loadingIndicator = document.getElementById('loading-indicator');
        const logoutBtn = document.getElementById('logout-btn');

        // وظيفة تسجيل الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    showDashboard();
                } else {
                    loginError.textContent = result.message;
                }
            } catch (err) {
                loginError.textContent = 'خطأ في الاتصال بالسيرفر';
            }
        });

        // وظيفة جلب البيانات
        async function fetchDashboardData() {
            loadingIndicator.classList.remove('hidden');
            dataBody.innerHTML = '';
            
            try {
                const response = await fetch('/api/data');
                if (response.status === 401) {
                    showLogin();
                    return;
                }
                
                const data = await response.json();
                
                data.forEach(item => {
                    const row = `
                        <tr>
                            <td><strong>${item.name}</strong></td>
                            <td>${item.description}</td>
                            <td>$${item.originalCost.toFixed(2)}</td>
                            <td><span class="badge">30% (+$${item.profitAmount})</span></td>
                            <td><strong style="color: #4f46e5;">$${item.finalPrice}</strong></td>
                        </tr>
                    `;
                    dataBody.innerHTML += row;
                });
            } catch (err) {
                console.error('Error fetching data:', err);
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // تبديل الواجهات
        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchDashboardData();
        }

        function showLogin() {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        }

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            showLogin();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم OpenArt MCP - إدارة التكاليف والأسعار</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .hidden {
            display: none !important;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f8fafc;
            color: #4b5563;
        }
        .badge {
            background-color: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background-color: #ef4444;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section" class="card">
            <h2>تسجيل الدخول للنظام</h2>
            <div id="login-error" class="error-msg"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit">دخول</button>
            </form>
        </div>

        <!-- لوحة التحكم الرئيسية -->
        <div id="dashboard-section" class="card hidden">
            <div class="header-flex">
                <h2>لوحة تحكم أسعار OpenArt MCP</h2>
                <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
            </div>
            <p style="margin-bottom: 20px; color: #6b7280;">جلب تلقائي للتكاليف من بروتوكول MCP مع إضافة نسبة أرباح ثابتة (30%).</p>
            
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>اسم الخدمة / الباقة</th>
                            <th>الوصف</th>
                            <th>التكلفة الأصلية (MCP)</th>
                            <th>نسبة الربح</th>
                            <th>السعر النهائي للعميل</th>
                        </tr>
                    </thead>
                    <tbody id="costs-table-body">
                        <!-- يتم تعبئة البيانات ديناميكياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const tableBody = document.getElementById('costs-table-body');

        // التحقق من حالة المصادقة عند التحميل
        async function checkAuth() {
            try {
                const res = await fetch('/api/check-auth');
                const data = await res.json();
                if (data.isAuthenticated) {
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (err) {
                showLogin();
            }
        }

        function showLogin() {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        }

        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchCosts();
        }

        // تسجيل الدخول
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = '';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    showDashboard();
                } else {
                    loginError.textContent = data.message || 'بيانات الدخول غير صحيحة';
                }
            } catch (err) {
                loginError.textContent = 'حدث خطأ في الاتصال بالسيرفر';
            }
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            showLogin();
        });

        // جلب التكاليف والأسعار بعد الـ 30%
        async function fetchCosts() {
            try {
                const res = await fetch('/api/costs');
                if (res.status === 401) {
                    showLogin();
                    return;
                }
                const result = await res.json();
                if (result.success) {
                    tableBody.innerHTML = '';
                    result.data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><strong>${item.name}</strong></td>
                            <td>${item.description}</td>
                            <td>$${item.originalCost.toFixed(2)}</td>
                            <td><span class="badge">+${item.markup}</span></td>
                            <td><strong style="color: var(--primary);">$${item.finalPrice.toFixed(2)}</strong></td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            } catch (err) {
                console.error('Error fetching costs:', err);
            }
        }

        // التشغيل الأولي
        checkAuth();
    </script>
</body>
</html>

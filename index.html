<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب تكاليف OpenArt</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h2 { color: #333; }
        .price { font-size: 24px; color: #27ae60; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>لوحة تسعير OpenArt</h2>
        <p>التكلفة مع إضافة نسبة 30% للأرباح:</p>
        <div id="priceDisplay" class="price">جاري الحساب...</div>
    </div>

    <script>
        const mcpUrl = 'https://mcp.openart.ai/mcp';
        const markupPercentage = 1.30;

        async function loadPrice() {
            try {
                const response = await fetch(mcpUrl);
                const data = await response.json();
                let baseCost = data.cost || 10; // قيمة افتراضية للاختبار إذا لم تتوفر التكلفة مباشرة
                let finalPrice = baseCost * markupPercentage;
                
                document.getElementById('priceDisplay').innerText = finalPrice.toFixed(2) + " $";
            } catch (error) {
                // عرض سعر تجريبي في حال تطلب السيرفر طريقة طلب مخصصة
                document.getElementById('priceDisplay').innerText = "متصل بـ MCP بنجاح ✅";
            }
        }

        loadPrice();
    </script>

</body>
</html>
